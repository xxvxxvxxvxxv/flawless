<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08131f"/>
      <stop offset="1" stop-color="#03070b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="60" y="70" fill="#e9f6ff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="5">WIRING</text>
  <text x="1140" y="68" text-anchor="end" fill="#52ffd0" font-family="Inter,Arial,sans-serif" font-size="17" letter-spacing="2">3.3 V ONLY</text>

  <rect x="70" y="125" width="340" height="410" rx="24" fill="#0b1723" stroke="#244358" stroke-width="3"/>
  <text x="240" y="175" text-anchor="middle" fill="#e9f6ff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">nRF24L01</text>

  <rect x="790" y="125" width="340" height="410" rx="24" fill="#0b1723" stroke="#244358" stroke-width="3"/>
  <text x="960" y="175" text-anchor="middle" fill="#e9f6ff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">ESP32-S3 AMOLED</text>

