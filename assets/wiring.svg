    <text x="330" y="225">VCC</text><text x="330" y="270">GND</text><text x="330" y="315">CE</text><text x="330" y="360">CSN</text>
    <text x="330" y="405">SCK</text><text x="330" y="450">MOSI</text><text x="330" y="495">MISO</text>
    <text x="820" y="225">3V3</text><text x="820" y="270">GND</text><text x="820" y="315">GPIO15</text><text x="820" y="360">GPIO14</text>
    <text x="820" y="405">GPIO12</text><text x="820" y="450">GPIO11</text><text x="820" y="495">GPIO13</text>
  </g>

  <g fill="#091019" stroke="#477087" stroke-width="2">
    <circle cx="390" cy="219" r="9"/><circle cx="390" cy="264" r="9"/><circle cx="390" cy="309" r="9"/><circle cx="390" cy="354" r="9"/>
    <circle cx="390" cy="399" r="9"/><circle cx="390" cy="444" r="9"/><circle cx="390" cy="489" r="9"/>
    <circle cx="810" cy="219" r="9"/><circle cx="810" cy="264" r="9"/><circle cx="810" cy="309" r="9"/><circle cx="810" cy="354" r="9"/>
    <circle cx="810" cy="399" r="9"/><circle cx="810" cy="444" r="9"/><circle cx="810" cy="489" r="9"/>
  </g>

  <g fill="none" stroke-width="5" stroke-linecap="round" filter="url(#glow)">
    <path d="M399 219H801" stroke="#ff5b69"/>
    <path d="M399 264H801" stroke="#708294"/>
    <path d="M399 309H801" stroke="#52ffd0"/>
    <path d="M399 354H801" stroke="#ffcc4a"/>
